# The Sponsor button of every MMFoundation repository without a FUNDING.yml of its own:
# sponsoring MMFoundation on Open Collective, where every contribution and expense is
# public. A repository shows the button only once Sponsorships is turned on in its
# Settings › General › Features. Priority support, sold on each app's website, is a paid
# service and never a way to sponsor, so it is not listed here.
open_collective: mmfoundation
